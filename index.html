    } else installBox.append(h('p', { class: 'help' }, 'Use your browser’s Install option in the address bar or menu to put Eommu on your home screen or desktop.'));
  };
  drawInstall();

  const file = h('input', { type: 'file', accept: 'application/json,.json', hidden: true, onchange: () => { if (file.files[0]) importBackup(file.files[0]); file.value = ''; } });
  const sc = (k, d) => h('li', {}, h('kbd', {}, k), h('span', {}, d));

  const body = h('div', { class: 'form settings' },
    h('div', { class: 'fld' }, h('span', { class: 'fl' }, 'Theme'), seg),
    h('div', { class: 'fld' }, h('span', { class: 'fl' }, 'Reminders'), notifState, h('div', { class: 'btn-row' }, notifBtn, testBtn)),
    installBox,
    h('div', { class: 'fld row' }, h('span', { class: 'fl' }, 'Sidebar mode'), switchBtn(!!S.settings.compact, (v) => { S.settings.compact = v; save(); render(); }, 'Sidebar mode')),
    h('p', { class: 'help' }, 'Sidebar mode folds Eommu into a narrow 375 px panel on the right, to sit beside other windows.'),
    h('div', { class: 'fld' }, h('span', { class: 'fl' }, 'Backup'),
      h('p', { class: 'help' }, 'Everything lives in this browser. Export a file now and then, and use it to move to another device.'),
      h('div', { class: 'btn-row' },
        h('button', { class: 'key', type: 'button', onclick: exportBackup }, icon('dl'), 'Export backup'),
        h('button', { class: 'key', type: 'button', onclick: () => file.click() }, icon('ul'), 'Import backup'), file)),
    h('div', { class: 'fld' }, h('span', { class: 'fl' }, 'Keyboard shortcuts'),
      h('ul', { class: 'keys' },
        sc('↑ ↓', 'Move between tasks'), sc('Space', 'Complete the focused task'), sc('S', 'Star the focused task'),
        sc('Enter', 'Edit the focused task’s title'), sc('Tab', 'Indent under the task above'), sc('Shift+Tab', 'Unindent to a top-level task'),
        sc('Esc', 'Leave a field and return to the task'), sc('Ctrl+Shift+P', 'Copy a preset to a date'))),
    h('div', { class: 'fld' }, h('span', { class: 'fl' }, 'Data'),
      h('button', {
        class: 'key danger', type: 'button', onclick: async () => {
          const ok = await confirmDialog('All lists, tasks and presets on this device will be removed. Export a backup first if you might want them back.', { confirmLabel: 'Erase everything', danger: true, title: 'Erase all data?' });
          if (!ok) return;
          const keep = S.settings; S = L.blankState(); S.settings = Object.assign(S.settings, keep, { lastPresetId: null });
          UI.presetId = null; commit(); toast('Everything was erased.');
        },
      }, icon('trash'), 'Erase everything')),
    h('p', { class: 'help about' }, 'Eommu 1.0. No account and no server: your data never leaves this device.'));
  openDialog({ title: 'Settings', body, cls: 'sheet', actions: [{ label: 'Done', kind: 'primary' }] });
}

/* ===== Eommu drag and drop: pointer events, so it works with touch, pen and mouse ===== */
'use strict';

const DND = { s: null, line: null };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function dndLine(rect, indent) {
  if (!DND.line) { DND.line = h('div', { class: 'dropline' }); document.body.append(DND.line); }
  if (!rect) { DND.line.style.display = 'none'; return; }
  Object.assign(DND.line.style, { display: 'block', left: rect.left + indent + 'px', width: Math.max(24, rect.width - indent) + 'px', top: rect.y + 'px' });
}
function dndClearHot() { $$('.drop-hot').forEach((n) => n.classList.remove('drop-hot')); dndLine(null); }

/* Each handler turns "what is under the pointer" into a drop description, and applies it. */
const DROP = {
  /* a task card dragged on the board */
  task: {
    over(el, srcId) {
      const t = L.getTask(S, srcId);
      const col = el && el.closest('.col');
      if (!col) return null;
      const listId = col.dataset.list, list = L.getList(S, listId);
      const sameList = listId === t.listId;
      const blocked = sameList && list.sort !== 'manual';
      const row = el.closest('.task');
      const srcUnit = $(`.unit[data-unit="${t.parentId || t.id}"]`);
      if (row && row.dataset.id === srcId) return { noop: true };
      if (!t.parentId && row && srcUnit && srcUnit.contains(row)) return { noop: true };

      if (t.parentId) {
        if (row && row.dataset.level === '2') {
          const r = row.getBoundingClientRect(), before = DND.s.y < r.top + r.height / 2;
          const subs = $$('.task.sub', row.closest('.subs')).filter((x) => x.dataset.id !== srcId);
          const i = subs.indexOf(row);
          return { kind: 'sub', parentId: row.dataset.parent, beforeId: before ? row.dataset.id : (subs[i + 1] ? subs[i + 1].dataset.id : null), line: { rect: { left: r.left, width: r.width, y: before ? r.top : r.bottom }, indent: 0 } };
        }
        if (row && row.dataset.level === '1') {
          const unit = row.closest('.unit'), first = $$('.subs .task', unit).find((x) => x.dataset.id !== srcId);
          const r = row.getBoundingClientRect();
          return { kind: 'sub', parentId: row.dataset.id, beforeId: first ? first.dataset.id : null, line: { rect: { left: r.left, width: r.width, y: r.bottom }, indent: 28 } };
        }
        return { kind: 'top', listId, beforeId: null, blocked, col };
      }
      if (row) {
        const unit = row.closest('.unit'), r = unit.getBoundingClientRect(), before = DND.s.y < r.top + r.height / 2;
        const units = $$('.unit', col.querySelector('.col-body')).filter((u) => u.dataset.unit !== srcId && !u.closest('.drawer'));
        const i = units.indexOf(unit);
        return { kind: 'top', listId, blocked, beforeId: before ? unit.dataset.unit : (units[i + 1] ? units[i + 1].dataset.unit : null), line: blocked ? null : { rect: { left: r.left, width: r.width, y: before ? r.top : r.bottom }, indent: 0 }, col: blocked ? col : null };
      }
      return { kind: 'top', listId, beforeId: null, blocked, col };
    },
    drop(info, srcId) {
      const t = L.getTask(S, srcId);
      if (info.blocked) { toast('Switch this list to My order to rearrange its tasks.'); return; }
      const fromList = t.listId;
      if (info.kind === 'sub') {
        const parent = L.getTask(S, info.parentId);
        t.listId = parent.listId; t.recur = null;
        L.place(S.tasks, t, { parentId: info.parentId, beforeId: info.beforeId });
      } else {
        const kids = L.childrenOf(S.tasks, t.id);
        t.listId = info.listId; kids.forEach((k) => { k.listId = info.listId; });
        L.place(S.tasks, t, { parentId: null, beforeId: info.beforeId, scope: inList(info.listId) });
      }
      UI.focusId = srcId;
      commit();
      if (t.listId !== fromList) toast(`Moved to ${L.getList(S, t.listId).name}.`);
    },
  },

  /* a calendar chip dragged to another day or hour */
  chip: {
    over(el) {
      const slot = el && el.closest('.slot, .allday');
      if (!slot) return null;
      if (slot.classList.contains('allday')) return { date: slot.dataset.date, time: null, hot: slot, label: `${dateLabel(slot.dataset.date)}, all day` };
      const r = slot.getBoundingClientRect();
      const frac = clamp((DND.s.y - r.top) / r.height, 0, 0.999);
      const time = `${L.pad(+slot.dataset.hour)}:${L.pad(Math.floor(frac * 4) * 15)}`;
      return { date: slot.dataset.date, time, hot: slot, label: `${dateLabel(slot.dataset.date)}, ${timeLabel(time)}` };
    },
    drop(info, srcId) {
      updateTask(srcId, { dueDate: info.date, dueTime: info.time });
      commit();
    },
  },

  /* an item dragged inside a preset */
  pitem: {
    over(el, srcId) {
      const box = el && el.closest('.pe-rows');
      if (!box) return null;
      const p = L.getPreset(S, box.dataset.preset);
      const it = p.items.find((x) => x.id === srcId);
      const row = el.closest('.prow');
      if (!it) return null;
      if (row && row.dataset.id === srcId) return { noop: true };
      const srcUnit = $(`.unit[data-unit="${it.parentId || it.id}"]`, box);
      if (!it.parentId && row && srcUnit && srcUnit.contains(row)) return { noop: true };
      const rect = (r, y, indent = 0) => ({ rect: { left: r.left, width: r.width, y }, indent });
      if (it.parentId) {
        if (row && row.dataset.level === '2') {
          const r = row.getBoundingClientRect(), before = DND.s.y < r.top + r.height / 2;
          const subs = $$('.prow.sub', row.closest('.subs')).filter((x) => x.dataset.id !== srcId);
          const i = subs.indexOf(row);
          return { kind: 'sub', preset: p.id, parentId: row.dataset.parent, beforeId: before ? row.dataset.id : (subs[i + 1] ? subs[i + 1].dataset.id : null), line: rect(r, before ? r.top : r.bottom) };
        }
        if (row && row.dataset.level === '1') {
          const unit = row.closest('.unit'), first = $$('.subs .prow', unit).find((x) => x.dataset.id !== srcId), r = row.getBoundingClientRect();
          return { kind: 'sub', preset: p.id, parentId: row.dataset.id, beforeId: first ? first.dataset.id : null, line: rect(r, r.bottom, 28) };
        }
        return { kind: 'top', preset: p.id, beforeId: null, hot: box };
      }
      if (row) {
        const unit = row.closest('.unit'), r = unit.getBoundingClientRect(), before = DND.s.y < r.top + r.height / 2;
        const units = $$('.unit', box).filter((u) => u.dataset.unit !== srcId);
        const i = units.indexOf(unit);
        return { kind: 'top', preset: p.id, beforeId: before ? unit.dataset.unit : (units[i + 1] ? units[i + 1].dataset.unit : null), line: rect(r, before ? r.top : r.bottom) };
      }
      return { kind: 'top', preset: p.id, beforeId: null, hot: box };
    },
    drop(info, srcId) {
      const p = L.getPreset(S, info.preset);
      const it = p.items.find((x) => x.id === srcId);
      L.place(p.items, it, { parentId: info.kind === 'sub' ? info.parentId : null, beforeId: info.beforeId });
      UI.focusId = srcId;
      commit();
    },
  },
};

function dndLabel(kind, id) {
  if (kind === 'task' || kind === 'chip') { const t = L.getTask(S, id); return t ? t.title || 'Untitled' : ''; }
  for (const p of S.presets) { const it = p.items.find((x) => x.id === id); if (it) return it.title || 'Untitled'; }
  return '';
}

function dndDown(e) {
  if (e.button > 0 || DND.s) return;
  const handle = e.target.closest('[data-drag]');
  if (!handle) return;
  const kind = handle.dataset.drag;
  if (kind === 'chip' && e.target.closest('button')) return;
  const srcEl = kind === 'chip' ? handle : handle.closest('.task');
  if (!srcEl) return;
  const touch = e.pointerType !== 'mouse';
  const s = DND.s = { kind, id: srcEl.dataset.id, srcEl, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, started: false, touch, longPress: kind === 'chip' && touch, pid: e.pointerId, info: null };
  if (s.longPress) s.timer = setTimeout(() => dndStart(), 320);
  window.addEventListener('pointermove', dndMove, { passive: false });
  window.addEventListener('pointerup', dndUp);
  window.addEventListener('pointercancel', dndCancel);
  window.addEventListener('keydown', dndKey, true);
}

function dndStart() {
  const s = DND.s;
  if (!s || s.started) return;
  s.started = true;
  clearTimeout(s.timer);
  s.ghost = h('div', { class: 'ghost' }, h('span', {}, dndLabel(s.kind, s.id)), h('em', {}));
  document.body.append(s.ghost);
  s.srcEl.classList.add('drag-src');
  document.body.classList.add('dragging');
  closeMenu();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  s.stopTouch = (ev) => ev.preventDefault();
  window.addEventListener('touchmove', s.stopTouch, { passive: false });
  if (navigator.vibrate && s.touch) { try { navigator.vibrate(8); } catch (e) { /* not allowed */ } }
  const tick = () => { if (DND.s !== s) return; dndScroll(); dndUpdate(); s.raf = requestAnimationFrame(tick); };
  s.raf = requestAnimationFrame(tick);
  dndUpdate();
}

function dndMove(e) {
  const s = DND.s;
  if (!s || e.pointerId !== s.pid) return;
  s.x = e.clientX; s.y = e.clientY;
  if (!s.started) {
    const d = Math.hypot(s.x - s.x0, s.y - s.y0);
    if (s.longPress) { if (d > 9) dndCancel(); return; }
    if (d > 5) dndStart(); else return;
  }
  e.preventDefault();
}

function dndUpdate() {
  const s = DND.s;
  if (!s || !s.started) return;
  s.ghost.style.transform = `translate(${s.x + 14}px, ${s.y + 12}px)`;
  const el = document.elementFromPoint(s.x, s.y);
  dndClearHot();
  const info = DROP[s.kind].over(el, s.id);
  s.info = info && !info.noop ? info : null;
  const note = $('em', s.ghost);
  if (info && info.label) note.textContent = info.label; else if (note.textContent) note.textContent = '';
  if (!info || info.noop) return;
  if (info.line) dndLine(info.line.rect, info.line.indent);
  const hot = info.hot || info.col || (info.blocked ? null : null);
  if (hot) hot.classList.add('drop-hot');
  if (info.blocked) s.ghost.classList.add('no'); else s.ghost.classList.remove('no');
}

function dndScroll() {
  const s = DND.s;
  let el = document.elementFromPoint(s.x, s.y);
  const EDGE = 56, speed = (d) => Math.min(18, 3 + d / 4);
  let v = false, hz = false;
  while (el && el !== document.documentElement && !(v && hz)) {
    const cs = getComputedStyle(el), r = el.getBoundingClientRect();
    if (!v && /(auto|scroll)/.test(cs.overflowY) && el.scrollHeight > el.clientHeight + 1) {
      if (s.y < r.top + EDGE) { el.scrollTop -= speed(r.top + EDGE - s.y); v = true; }
      else if (s.y > r.bottom - EDGE) { el.scrollTop += speed(s.y - (r.bottom - EDGE)); v = true; }
    }
    if (!hz && /(auto|scroll)/.test(cs.overflowX) && el.scrollWidth > el.clientWidth + 1) {
      if (s.x < r.left + EDGE) { el.scrollLeft -= speed(r.left + EDGE - s.x); hz = true; }
      else if (s.x > r.right - EDGE) { el.scrollLeft += speed(s.x - (r.right - EDGE)); hz = true; }
    }
    el = el.parentElement;
  }
}

function dndEnd() {
  const s = DND.s;
  if (!s) return;
  clearTimeout(s.timer); cancelAnimationFrame(s.raf);
  window.removeEventListener('pointermove', dndMove);
  window.removeEventListener('pointerup', dndUp);
  window.removeEventListener('pointercancel', dndCancel);
  window.removeEventListener('keydown', dndKey, true);
  if (s.stopTouch) window.removeEventListener('touchmove', s.stopTouch);
  if (s.ghost) s.ghost.remove();
  s.srcEl.classList.remove('drag-src');
  document.body.classList.remove('dragging');
  dndClearHot();
  DND.s = null;
  if (s.started) {
    const stop = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
    window.addEventListener('click', stop, true);
    setTimeout(() => window.removeEventListener('click', stop, true), 80);
  }
}
function dndUp(e) {
  const s = DND.s;
  if (!s || e.pointerId !== s.pid) return;
  if (s.started) { s.x = e.clientX; s.y = e.clientY; dndUpdate(); } // resolve the drop at the exact release point
  const { started, info, kind, id } = s;
  dndEnd();
  if (started && info) DROP[kind].drop(info, id);
}
function dndCancel() { dndEnd(); }
function dndKey(e) { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); dndEnd(); } }

document.addEventListener('pointerdown', dndDown, { passive: true });
document.addEventListener('contextmenu', (e) => { if (DND.s && DND.s.started) e.preventDefault(); });

/* ===== Eommu reminders, auto-copy, service worker and install ===== */
'use strict';

/* ---------- tiny IndexedDB mirror so the service worker can see upcoming reminders ---------- */
const IDB = {
  open() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no idb'));
      const rq = indexedDB.open('eommu', 1);
      rq.onupgradeneeded = () => { rq.result.createObjectStore('kv'); };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  },
  async get(k) { const db = await IDB.open(); return new Promise((res) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); }); },
  async set(k, v) { const db = await IDB.open(); return new Promise((res) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => res(); }); },
};

let mirrorT = null;
function afterSave() {
  clearTimeout(mirrorT);
  mirrorT = setTimeout(() => { mirrorReminders(); updateBadge(); }, 400);
}
function mirrorReminders() {
  if (!S) return;
  const today = L.today(), until = L.addDays(today, 14);
  const list = S.tasks.filter((t) => !t.isCompleted && t.dueTime && t.dueDate >= today && t.dueDate <= until)
    .map((t) => ({ id: t.id, title: t.title, date: t.dueDate, time: t.dueTime, list: (L.getList(S, t.listId) || {}).name || '' }));
  IDB.set('reminders', { enabled: S.settings.reminders !== false, items: list }).catch(() => {});
}
function updateBadge() {
  if (!S || !('setAppBadge' in navigator)) return;
  const n = L.todayView(S).count;
  (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {});
}

/* ---------- reminders ---------- */
const notified = new Set();
try { JSON.parse(localStorage.getItem('eommu.notified') || '[]').forEach((k) => notified.add(k)); } catch (e) { /* none */ }
function rememberNotified(key) {
  notified.add(key);
  const recent = [...notified].slice(-300);
  try { localStorage.setItem('eommu.notified', JSON.stringify(recent)); } catch (e) { /* ignore */ }
  IDB.set('shown', recent).catch(() => {});
}

async function requestNotifications() {
  if (!('Notification' in window)) { toast('This browser does not support notifications.'); return 'unsupported'; }
  let p = Notification.permission;
  if (p === 'default') { try { p = await Notification.requestPermission(); } catch (e) { p = Notification.permission; } }
  if (p === 'granted') { registerPeriodicSync(); toast('Notifications are on.'); }
  else if (p === 'denied') toast('Notifications are blocked. Allow them in your browser settings to get alerts.', { ms: 7000 });
  return p;
}

async function showNative(title, body, tag, taskId) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const opts = { body, tag, icon: './icons/icon-192.png', badge: './icons/icon-192.png', data: { taskId }, renotify: true, requireInteraction: false, actions: taskId ? [{ action: 'done', title: 'Mark done' }] : [] };
  try {
    const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
    if (reg && reg.showNotification) { await reg.showNotification(title, opts); return; }
  } catch (e) { /* fall through */ }
  try { const n = new Notification(title, { body, tag, icon: opts.icon }); n.onclick = () => { window.focus(); n.close(); }; } catch (e) { /* ignore */ }
}

function sendTestNotification() {
  showNative('Eommu reminder test', 'This is how a reminder looks.', 'eommu-test');
  toast('Test sent. Check your notifications.');
}

function alertTask(t) {
  const l = L.getList(S, t.listId);
  const when = `${timeLabel(t.dueTime)}${l ? ' in ' + l.name : ''}`;
  toast(`${t.title || 'Untitled task'}, ${when}`, {
    kind: 'reminder', ms: 60000,
    actions: [{ label: 'Mark done', fn: () => toggleDone(t.id) }],
  });
  showNative(t.title || 'Task reminder', when, `${t.id}|${t.dueDate}|${t.dueTime}`, t.id);
}

/** Runs every 30 seconds: fires reminders whose clock time has arrived. Late ones are bundled. */
function checkReminders() {
  if (!S || S.settings.reminders === false) return;
  const today = L.today(), hm = L.nowHM();
  const nowMin = L.timeToMin(hm);
  const fresh = [], stale = [];
  L.dueReminders(S, today, hm).forEach((t) => {
    const key = `${t.id}|${t.dueDate}|${t.dueTime}`;
    if (notified.has(key)) return;
    rememberNotified(key);
    (nowMin - L.timeToMin(t.dueTime) <= 15 ? fresh : stale).push(t);
  });
  fresh.forEach(alertTask);
  if (stale.length) {
    toast(`${stale.length} reminder${stale.length > 1 ? 's' : ''} came due while Eommu was closed.`, { ms: 12000, actions: [{ label: 'View', fn: () => setView('today') }] });
  }
}

/* ---------- daily auto-copy ---------- */
function runAutoCopy() {
  if (!S) return;
  const due = L.autoCopyDue(S);
  if (!due.length) return;
  due.forEach((p) => {
    const res = L.copyPreset(S, p.id, { date: L.today() });
    p.lastCopiedDate = L.today();
    const where = presetTargetName(p, res.listId);
    toast(`${p.name} was copied into ${where} for today.`, { actions: [{ label: 'View', fn: () => setView('board') }], ms: 9000 });
    showNative('Today’s schedule is ready', `${p.name} was added to ${where}.`, `auto|${p.id}|${L.today()}`);
  });
  commit();
}

/* ---------- one heartbeat ---------- */
let lastDay = null;
function tick() {
  if (!S) return;
  runAutoCopy();
  checkReminders();
  const day = L.today();
  if (lastDay && lastDay !== day) softRender(); // midnight: overdue badges roll forward
  else if (UI.view === 'calendar' || UI.view === 'widget') softRender();
  lastDay = day;
}

/* ---------- service worker, install, updates ---------- */
window.deferredInstall = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.deferredInstall = e; });
window.addEventListener('appinstalled', () => { window.deferredInstall = null; toast('Eommu is installed.'); });
async function promptInstall() {
  const e = window.deferredInstall;
  if (!e) return;
  e.prompt();
  try { await e.userChoice; } catch (err) { /* ignore */ }
  window.deferredInstall = null;
}

async function registerPeriodicSync() {
  try {
    const reg = await navigator.serviceWorker.ready;
    if (!reg.periodicSync) return;
    const st = await navigator.permissions.query({ name: 'periodic-background-sync' });
    if (st.state === 'granted') await reg.periodicSync.register('eommu-reminders', { minInterval: 15 * 60 * 1000 });
  } catch (e) { /* not supported here */ }
}

let updating = false, reloading = false;
function registerWorker() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  navigator.serviceWorker.register('./sw.js').then((reg) => {
    const offer = (w) => toast('A new version of Eommu is ready.', { ms: 20000, actions: [{ label: 'Reload', fn: () => { updating = true; w.postMessage('SKIP_WAITING'); } }] });
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
    if (Notification && Notification.permission === 'granted') registerPeriodicSync();
  }).catch(() => { /* offline mode simply unavailable */ });
  // reload only when the person asked for the update; the first install must not reload the page
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (updating && !reloading) { reloading = true; location.reload(); } });
  navigator.serviceWorker.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'done' && e.data.taskId) { markDoneFromNotification(e.data.taskId); }
  });
}

function markDoneFromNotification(taskId) {
  const t = L.getTask(S, taskId);
  if (t && !t.isCompleted) { toggleDone(taskId); }
}

/** The first time a clock time is set, offer to turn on alerts (once per visit). */
function nudgeNotifications() {
  if (UI.askedNotif || !('Notification' in window) || Notification.permission !== 'default') return;
  UI.askedNotif = true;
  toast('Allow notifications to be reminded at this time, even when Eommu is in the background.', {
    ms: 12000, actions: [{ label: 'Allow', fn: () => requestNotifications() }],
  });
}

/* ===== Eommu start-up, keyboard shortcuts and URL actions ===== */
'use strict';

function visibleRows(fromRow) {
  const scope = fromRow.closest('.col-body, .smart-rows, .pe-rows, .drawer-body') || $('#main');
  return $$('.task', scope);
}

document.addEventListener('keydown', (e) => {
  if (e.defaultPrevented) return;
  const key = e.key;
  // Copy-preset modal works from anywhere
  if (e.ctrlKey && e.shiftKey && (key === 'P' || key === 'p')) {
    e.preventDefault();
    if (!$('dialog[open]')) openCopyModal();
    return;
  }
  if ($('dialog[open]') || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (!t || !t.classList || !t.classList.contains('task')) return; // only act when a task row itself has focus
  const id = t.dataset.id;
  const rows = visibleRows(t);
  const i = rows.indexOf(t);
  const isPreset = t.classList.contains('prow');

  if (key === 'ArrowDown' || key === 'ArrowUp') {
    e.preventDefault();
    const next = rows[i + (key === 'ArrowDown' ? 1 : -1)];
    if (next) { next.tabIndex = 0; next.focus(); UI.focusId = next.dataset.id; next.scrollIntoView({ block: 'nearest' }); }
  } else if (key === ' ' && !isPreset) {
    e.preventDefault(); toggleDone(id);
  } else if ((key === 's' || key === 'S') && !isPreset) {
    e.preventDefault(); toggleStar(id);
  } else if (key === 's' || key === 'S') {
    e.preventDefault();
    const p = S.presets.find((x) => x.items.some((it) => it.id === id));
    const it = p && p.items.find((x) => x.id === id);
    if (it) { it.isStarred = !it.isStarred; UI.focusId = id; commit(); }
  } else if (key === 'Enter') {
    e.preventDefault();
    const ta = $('textarea.title', t);
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  } else if (key === 'Tab' && !isPreset) {
    const task = L.getTask(S, id);
    if (!task || task.isCompleted || !t.closest('.col-body')) return;
    if (!e.shiftKey && !task.parentId && visibleTopIds(task.listId).indexOf(id) > 0) { e.preventDefault(); indentTask(id); }
    else if (e.shiftKey && task.parentId) { e.preventDefault(); unindentTask(id); }
  } else if (key === 'Tab' && isPreset) {
    const p = S.presets.find((x) => x.items.some((it) => it.id === id));
    const it = p && p.items.find((x) => x.id === id);
    if (!it) return;
    if (!e.shiftKey && !it.parentId && presetTopIds(p).indexOf(id) > 0) { e.preventDefault(); indentItem(p, it); }
    else if (e.shiftKey && it.parentId) { e.preventDefault(); unindentItem(p, it); }
  } else if (key === 'Escape') {
    t.blur();
  }
});

window.addEventListener('storage', (e) => {
  if (e.key !== KEY || !e.newValue) return;
  try { S = L.validateImport({ data: JSON.parse(e.newValue) }); softRender(); } catch (err) { /* ignore a bad write from another tab */ }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); } });
window.addEventListener('focus', tick);
window.addEventListener('pagehide', () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } });
window.addEventListener('online', () => {});

function handleUrlActions() {
  const q = new URLSearchParams(location.search);
  if (![...q.keys()].length) return;
  const view = q.get('view');
  if (view && VIEW_TITLES[view]) { UI.view = view; S.settings.view = view; }
  const done = q.get('done');
  if (done) markDoneFromNotification(done);
  const action = q.get('action');
  const sharedTitle = q.get('title'), sharedText = q.get('text'), sharedUrl = q.get('url');
  history.replaceState(null, '', location.pathname);
  render();
  if (action === 'copy') setTimeout(() => openCopyModal(), 200);
  else if (action === 'capture' || sharedTitle || sharedText || sharedUrl) {
    const found = (sharedText || '').match(/https?:\/\/[^\s]+/);
    setTimeout(() => openCapture({
      title: sharedTitle || (sharedText ? sharedText.replace(/https?:\/\/[^\s]+/g, '').trim().slice(0, 200) : ''),
      url: sharedUrl || (found ? found[0] : ''), label: sharedTitle && (sharedUrl || found) ? sharedTitle.slice(0, 60) : '',
    }), 200);
  }
}

function boot() {
  S = loadState();
  L.normalize(S);
  UI.view = VIEW_TITLES[S.settings.view] ? S.settings.view : 'board';
  save();
  render();
  handleUrlActions();
  lastDay = L.today();
  // let the service worker's record of shown reminders merge in before the first check
  IDB.get('shown').then((arr) => { (arr || []).forEach((k) => notified.add(k)); }).catch(() => {}).finally(() => { tick(); });
  setInterval(tick, 30000);
  registerWorker();
  mirrorReminders(); updateBadge();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
</body>
