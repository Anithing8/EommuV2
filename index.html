/* ---------- board ---------- */
function listColumn(list, today) {
  const view = L.listView(S, list, today);
  UI.orderCtx[list.id] = view.sections.flatMap((s) => s.units.map((u) => u.task.id));
  const sortNames = { manual: 'My order', due: 'Due date', starred: 'Starred recently', title: 'Title' };

  const titleIn = h('input', { class: 'col-title', type: 'text', value: list.name, maxLength: 120, a: { 'aria-label': 'List name' } });
  titleIn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') titleIn.blur();
    if (e.key === 'Escape') { titleIn.value = list.name; titleIn.blur(); }
  });
  titleIn.addEventListener('blur', () => {
    const v = titleIn.value.trim();
    if (v && v !== list.name) { renameList(list.id, v); deferRender(); } else titleIn.value = list.name;
  });

  const menuBtn = h('button', {
    class: 'ibtn quiet', type: 'button', title: 'List actions', a: { 'aria-label': `Actions for ${list.name}`, 'aria-haspopup': 'menu' },
    onclick: () => openMenu(menuBtn, [
      { label: 'Rename', icon: 'rename', onClick: () => { titleIn.focus(); titleIn.select(); } },
      { label: 'Hide from board', icon: 'board', onClick: () => { list.visible = false; commit(); } },
      { sep: true },
      { label: list.isDefault ? 'Default list can’t be deleted' : 'Delete list', icon: 'trash', danger: true, disabled: list.isDefault, onClick: () => deleteList(list.id) },
    ], { align: 'end' }),
  }, icon('more'));

  const sortBtn = h('button', {
    class: 'key small', type: 'button', title: 'Sort this list', a: { 'aria-haspopup': 'menu' },
    onclick: () => openMenu(sortBtn, [{ head: 'Sort this list' }].concat(L.SORTS.map((s) => ({
      label: sortNames[s], icon: 'sort', checked: list.sort === s, onClick: () => setSort(list.id, s),
    })))),
  }, icon('sort'), h('span', {}, sortNames[list.sort]));

  const tools = h('div', { class: 'col-tools' },
    sortBtn,
    h('button', { class: 'key small', type: 'button', onclick: (e) => presetMenu(e.currentTarget, { listId: list.id }) }, icon('plus'), 'Load preset…'),
    h('button', {
      class: 'key small', type: 'button', title: 'Save this list as a reusable preset schedule',
      onclick: () => saveListAsPreset(list.id),
    }, icon('save'), 'Save list as preset'));

  const body = h('div', { class: 'col-body', dataset: { list: list.id }, role: 'list', a: { 'aria-label': `${list.name} tasks` } });
  body.append(addRow(list));
  view.sections.forEach((s) => {
    if (s.label) body.append(h('div', { class: `sec-head ${s.key}` }, h('span', {}, s.label), h('span', { class: 'count soft' }, s.units.length)));
    s.units.forEach((u) => body.append(taskUnit(u, { mode: 'board', drag: true, today })));
  });
  if (!view.count) {
    body.append(h('div', { class: 'empty' },
      h('p', {}, view.completed.length ? 'All done here.' : 'Nothing here yet.'),
      h('p', { class: 'sub' }, 'Add a task above, or load a preset to fill the day.')));
  }
  body.append(completedDrawer(list, view));

  return h('section', { class: `col c${list.color % 6}`, dataset: { list: list.id }, a: { 'aria-label': list.name } },
    h('header', { class: 'col-head' }, h('i', { class: `dot c${list.color % 6}` }), titleIn, h('span', { class: 'count' }, view.count), menuBtn),
    tools, body);
}

function boardView() {
  const today = L.today();
  const lists = S.lists.filter((l) => l.visible).sort((a, b) => a.order - b.order);
  if (!lists.length) {
    return h('div', { class: 'blank' },
      h('p', { class: 'big' }, 'No lists are showing.'),
      h('p', { class: 'sub' }, 'Tick a list in the sidebar to put it on the board.'),
      h('button', { class: 'key primary', type: 'button', onclick: () => { UI.sidebarOpen = true; applyLayout(); } }, 'Open lists'));
  }
  const board = h('div', { class: 'board' }, lists.map((l) => listColumn(l, today)),
    h('button', { class: 'new-col', type: 'button', onclick: newListFlow }, icon('plus'), h('span', {}, 'New list')));
  return board;
}

async function saveListAsPreset(listId) {
  const list = L.getList(S, listId);
  const open = S.tasks.filter((t) => t.listId === listId && !t.isCompleted);
  if (!open.length) { toast('This list has no open tasks to save.'); return; }
  const name = await promptDialog({
    title: 'Save list as preset', label: 'Preset name', value: `${list.name} preset`, confirmLabel: 'Save preset',
  });
  if (!name) return;
  const p = L.presetFromList(S, list, name);
  S.settings.lastPresetId = p.id;
  commit();
  toast(`Saved “${p.name}” with ${p.items.length} item${p.items.length > 1 ? 's' : ''}.`, {
    actions: [{ label: 'Open', fn: () => setView('presets', { presetId: p.id, pane: 'edit' }) }],
  });
}

/* ---------- smart views ---------- */
function emptyState(title, sub, withPreset) {
  return h('div', { class: 'blank' }, h('p', { class: 'big' }, title), h('p', { class: 'sub' }, sub), withPreset ? presetSplit() : null);
}
function rowsFor(tasks, today) {
  return tasks.map((t) => {
    const parent = t.parentId ? L.getTask(S, t.parentId) : null;
    return taskRow(t, { mode: 'smart', showList: true, today, crumb: parent ? parent.title : null });
  });
}
function todayViewEl() {
  const today = L.today();
  const v = L.todayView(S, today);
  if (!v.count) return emptyState('Nothing due today.', 'Anything overdue or due today shows up here, from every list.', true);
  const wrap = h('div', { class: 'panel' });
  if (v.past.length) wrap.append(h('section', { class: 'smart-sec' },
    h('div', { class: 'sec-head past' }, h('span', {}, 'Past due'), h('span', { class: 'count soft' }, v.past.length)),
    h('div', { class: 'smart-rows', role: 'list' }, rowsFor(v.past, today))));
  if (v.today.length) wrap.append(h('section', { class: 'smart-sec' },
    h('div', { class: 'sec-head today' }, h('span', {}, 'Today'), h('span', { class: 'count soft' }, v.today.length)),
    h('div', { class: 'smart-rows', role: 'list' }, rowsFor(v.today, today))));
  return wrap;
}
function starredViewEl() {
  const today = L.today();
  const v = L.starredView(S);
  if (!v.active.length && !v.completed.length) return emptyState('No starred tasks.', 'Star a task or subtask and it appears here, still kept in its own list.', false);
  const wrap = h('div', { class: 'panel' },
    h('section', { class: 'smart-sec' }, h('div', { class: 'smart-rows', role: 'list' }, v.active.length ? rowsFor(v.active, today) : h('p', { class: 'empty-note' }, 'Everything starred is done.'))));
  if (v.completed.length) {
    const open = UI.starDone;
    wrap.append(h('div', { class: `drawer${open ? ' open' : ''}` },
      h('div', { class: 'drawer-head' }, h('button', {
        class: 'drawer-toggle', type: 'button', a: { 'aria-expanded': String(open) },
        onclick: () => { UI.starDone = !open; render(); },
      }, icon('chevR', open ? 'turn' : ''), h('span', {}, `Completed (${v.completed.length})`))),
      open ? h('div', { class: 'drawer-body', role: 'list' }, rowsFor(v.completed, today)) : null));
  }
  return wrap;
}

/* ---------- quick focus widget ---------- */
function widgetView() {
  const today = L.today();
  const st = L.todayStats(S, today);
  const t = L.todayView(S, today);
  const doneToday = S.tasks.filter((x) => x.dueDate === today && x.isCompleted)
    .sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
  const N = 20, lit = Math.round((st.pct / 100) * N);
  const segs = Array.from({ length: N }, (_, i) => h('i', { class: i < lit ? 'seg-on' : '' }));
  const full = st.total > 0 && st.done === st.total;
  const date = L.parseDate(today).toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });

  const quick = h('input', {
    class: 'field', type: 'text', placeholder: 'Add something for today', maxLength: 500, a: { 'aria-label': 'Add a task for today' },
  });
  quick.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.isComposing) return;
    const v = quick.value.trim();
    if (!v) return;
    const def = L.defaultList(S);
    addTask(def.id, v, { props: { dueDate: today } });
    commit();
    const q = $('.widget .field'); if (q) q.focus();
  });

  return h('div', { class: 'widget' },
    h('section', { class: 'device', a: { 'aria-label': 'Progress today' } },
      h('p', { class: 'w-date' }, date),
      h('div', { class: 'lcd' },
        h('span', { class: 'pct', a: { 'aria-live': 'polite' } }, `${st.pct}`, h('small', {}, '%')),
        h('span', { class: 'lcd-note' }, st.total ? (full ? 'All done' : `${st.done} of ${st.total} done`) : 'Nothing planned')),
      h('div', { class: `leds${full ? ' full' : ''}`, role: 'progressbar', a: { 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(st.pct), 'aria-label': 'Completed today' } }, segs),
      st.overdue ? h('p', { class: 'w-over' }, h('i', { class: 'led' }), `${st.overdue} overdue ${st.overdue > 1 ? 'tasks are' : 'task is'} included`) : null,
      h('div', { class: 'w-actions' }, presetSplit({ cls: 'wide' })),
      quick),
    h('section', { class: 'w-list', a: { 'aria-label': 'Today’s checklist' } },
      t.past.length ? h('div', { class: 'smart-sec' }, h('div', { class: 'sec-head past' }, h('span', {}, 'Overdue'), h('span', { class: 'count soft' }, t.past.length)),
        h('div', { class: 'smart-rows', role: 'list' }, rowsFor(t.past, today))) : null,
      t.today.length ? h('div', { class: 'smart-sec' }, h('div', { class: 'sec-head today' }, h('span', {}, 'To do today'), h('span', { class: 'count soft' }, t.today.length)),
        h('div', { class: 'smart-rows', role: 'list' }, rowsFor(t.today, today))) : null,
      doneToday.length ? h('div', { class: 'smart-sec' }, h('div', { class: 'sec-head' }, h('span', {}, 'Done'), h('span', { class: 'count soft' }, doneToday.length)),
        h('div', { class: 'smart-rows', role: 'list' }, rowsFor(doneToday, today))) : null,
      !t.count && !doneToday.length ? h('p', { class: 'empty-note center' }, 'Load a preset or add a task to start the day.') : null));
}

/* ===== Eommu task rows: the card, its inline editing, notes, badges and menus ===== */
'use strict';

function listChipFor(listId) {
  const l = L.getList(S, listId);
  if (!l) return null;
  return h('span', { class: `badge listb c${l.color % 6}` }, h('i', { class: 'dot' }), l.name);
}

function sourceChip(src) {
  const url = safeUrl(src.url);
  const label = src.label || (url ? new URL(url).hostname.replace(/^www\./, '') : 'Source');
  if (!url) return h('span', { class: 'badge src' }, icon('link'), label);
  return h('a', { class: 'badge src', href: url, target: '_blank', rel: 'noopener noreferrer', title: url, onclick: (e) => e.stopPropagation() },
    icon('link'), h('span', { class: 'tx' }, label));
}

function dateBadges(t, today) {
  const out = [];
  if (t.dueDate) {
    const past = !t.isCompleted && t.dueDate < today;
    out.push(h('button', {
      class: `badge date${past ? ' late' : ''}`, type: 'button', title: 'Change due date',
      onclick: (e) => { e.stopPropagation(); openTaskSheet(t.id, { focus: 'date' }); },
    }, past ? h('i', { class: 'led' }) : icon('cal'), past ? h('b', {}, 'Past due') : null, dateLabel(t.dueDate, today)));
    if (t.dueTime) {
      out.push(h('button', {
        class: `badge time${past ? ' late' : ''}`, type: 'button', title: 'Change time',
        onclick: (e) => { e.stopPropagation(); openTaskSheet(t.id, { focus: 'time' }); },
      }, icon('clock'), timeLabel(t.dueTime)));
    }
  }
  return out;
}

/* ----- notes: collapsed when empty, expands when clicked or filled; URLs become links ----- */
function notesBlock(t) {
  if (UI.notesOpen === t.id) {
    const ta = h('textarea', {
      class: 'notes-in grow', rows: 2, value: t.notes, placeholder: 'Add notes. Links become clickable.',
      a: { 'aria-label': 'Notes' },
    });
    ta.addEventListener('input', () => autoSize(ta));
    const finish = () => {
      if (ta._done) return; ta._done = true;
      t.notes = ta.value.slice(0, 4000);
      UI.notesOpen = null; save(); deferRender(120);
    };
    ta.addEventListener('blur', finish);
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); ta.blur(); }
    });
    UI.focusEl = ta;
    return h('div', { class: 'notes open' }, ta);
  }
  if (!t.notes) return null;
  const view = h('div', {
    class: 'notes', tabIndex: 0, role: 'button', title: 'Edit notes',
    onclick: (e) => { if (e.target.closest('a')) return; openNotes(t.id); },
    onkeydown: (e) => { if (e.key === 'Enter' && e.target === view) { e.preventDefault(); openNotes(t.id); } },
  }, linkify(t.notes));
  return view;
}

function taskMenu(t, anchor, mode) {
  const list = L.getList(S, t.listId);
  const board = mode === 'board';
  const items = [{ label: 'Details', icon: 'sliders', onClick: () => openTaskSheet(t.id) }];
  if (!t.notes) items.push({ label: 'Add notes', icon: 'note', onClick: () => openNotes(t.id) });
  if (!t.parentId && !t.isCompleted) items.push({ label: 'Add subtask', icon: 'plus', onClick: () => startSubtask(t.id) });
  if (board && !t.isCompleted) {
    items.push({ sep: true });
    if (!t.parentId) items.push({ label: 'Indent', icon: 'indent', hint: 'Tab', onClick: () => indentTask(t.id) });
    else items.push({ label: 'Unindent', icon: 'unindent', hint: 'Shift+Tab', onClick: () => unindentTask(t.id) });
    if (list.sort === 'manual') {
      items.push({ label: 'Move up', icon: 'up', onClick: () => nudgeTask(t.id, -1) },
        { label: 'Move down', icon: 'down', onClick: () => nudgeTask(t.id, 1) });
    }
  }
  items.push({ sep: true }, { label: 'Delete', icon: 'trash', danger: true, onClick: () => removeTask(t.id) });
  openMenu(anchor, items, { align: 'end' });
}

/**
 * One task or subtask.
 * o.mode: 'board' (manual editing, drag), 'smart' (aggregate views), 'drawer' (completed)
 */
function taskRow(t, o = {}) {
  const today = o.today || L.today();
  const sub = !!t.parentId;
  const mode = o.mode || 'board';
  const kids = sub ? [] : S.tasks.filter((k) => k.parentId === t.id);
  const row = h('div', {
    class: `task${sub ? ' sub' : ''}${t.isCompleted ? ' done' : ''}${t.isStarred ? ' starred' : ''}`,
    tabIndex: -1, role: 'listitem',
    dataset: { id: t.id, level: sub ? 2 : 1, list: t.listId, parent: t.parentId || '' },
  });
  row.addEventListener('click', (e) => {
    if (e.target === row || e.target.classList.contains('body') || e.target.classList.contains('meta')) { UI.focusId = t.id; row.focus(); }
  });
  row.addEventListener('focus', () => { UI.focusId = t.id; });

  const grip = o.drag
    ? h('span', { class: 'grip', dataset: { drag: 'task' }, title: 'Drag to move', a: { 'aria-hidden': 'true' } }, icon('grip'))
    : null;

  const check = h('button', {
    class: 'check', type: 'button', role: 'checkbox',
    a: { 'aria-checked': String(t.isCompleted), 'aria-label': t.isCompleted ? 'Mark as not done' : 'Mark as done' },
    onclick: (e) => { e.stopPropagation(); toggleDone(t.id); },
  }, icon('check'));

  /* title: an always-editable field, so a click edits immediately with no modal */
  const ta = h('textarea', {
    class: 'title grow', rows: 1, maxLength: 500, value: t.title, spellcheck: true, placeholder: 'Task title',
    a: { 'aria-label': sub ? 'Subtask title' : 'Task title' },
  });
  ta.addEventListener('input', () => autoSize(ta));
  ta.addEventListener('focus', () => { UI.focusId = t.id; });
  const flush = () => {
    const v = ta.value.trim();
    if (v) { if (v !== t.title) setTitle(t.id, v); if (UI.fresh === t.id) UI.fresh = null; return true; }
    return false;
  };
  ta.addEventListener('keydown', (e) => {
    if (e.isComposing) return;
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!flush()) {
        if (UI.fresh === t.id) { ta._done = true; L.deleteTask(S, t.id); UI.fresh = null; UI.focusId = null; commit(); }
        else { ta.value = t.title; ta.blur(); }
        return;
      }
      ta._done = true;
      if (mode === 'board' && !t.isCompleted) {
        const n = addTask(t.listId, '', { parentId: t.parentId, afterId: t.id });
        UI.fresh = n.id; UI.focusTitleId = n.id; commit();
      } else { save(); ta.blur(); deferRender(0); }
    } else if (e.key === 'Escape') {
      e.preventDefault();
      ta.value = t.title; autoSize(ta); ta._done = true; ta.blur();
      if (UI.fresh === t.id && !t.title) { L.deleteTask(S, t.id); UI.fresh = null; commit(); return; }
      row.focus();
    } else if (e.key === 'Tab' && mode === 'board' && !t.isCompleted) {
      if (!e.shiftKey && !t.parentId) {
        const ids = visibleTopIds(t.listId);
        if (ids.indexOf(t.id) > 0) {
          e.preventDefault();
          if (!flush() && UI.fresh !== t.id) ta.value = t.title;
          ta._done = true; UI.focusTitleId = t.id; indentTask(t.id);
        }
      } else if (e.shiftKey && t.parentId) {
        e.preventDefault(); flush(); ta._done = true; UI.focusTitleId = t.id; unindentTask(t.id);
      }
    }
  });
  ta.addEventListener('blur', () => {
    if (ta._done) return;
    if (flush()) { deferRender(); return; }
    if (UI.fresh === t.id) { L.deleteTask(S, t.id); UI.fresh = null; save(); deferRender(); }
    else ta.value = t.title;
  });
  if (UI.focusTitleId === t.id) UI.focusEl = ta;

  const meta = [];
  if (!sub && t.recur && t.recur.freq && t.recur.freq !== 'none') {
    meta.push(h('button', { class: 'badge rep', type: 'button', title: 'Change repeat', onclick: (e) => { e.stopPropagation(); openTaskSheet(t.id, { focus: 'repeat' }); } },
      icon('repeat'), repeatLabel(t.recur)));
  }
  meta.unshift(...dateBadges(t, today));
  if (t.source) meta.push(sourceChip(t.source));
  if (kids.length) {
    const d = kids.filter((k) => k.isCompleted).length;
    meta.push(h('span', { class: 'badge cnt', title: `${d} of ${kids.length} subtasks done` }, `${d}/${kids.length}`));
  }
  if (o.showList) meta.push(listChipFor(t.listId));
  if (o.crumb) meta.push(h('span', { class: 'badge crumb', title: 'Subtask of' }, 'in ', h('em', {}, o.crumb)));

  const body = h('div', { class: 'body' }, ta, notesBlock(t), meta.length ? h('div', { class: 'meta' }, meta) : null);

  const star = h('button', {
    class: `star${t.isStarred ? ' on' : ''}`, type: 'button', title: t.isStarred ? 'Remove star' : 'Star as priority',
    a: { 'aria-pressed': String(t.isStarred), 'aria-label': t.isStarred ? 'Remove star' : 'Star as priority' },
    onclick: (e) => { e.stopPropagation(); toggleStar(t.id); },
  }, icon('star'));
  const more = h('button', {
    class: 'ibtn quiet', type: 'button', title: 'More actions', a: { 'aria-label': 'More actions', 'aria-haspopup': 'menu' },
    onclick: (e) => { e.stopPropagation(); taskMenu(t, more, mode); },
  }, icon('more'));

  const acts = h('div', { class: 'acts' }, star, more);
  const hovs = h('div', { class: 'hovs' });
  if (!t.dueDate && !t.isCompleted) hovs.append(iconBtn('cal', 'Add a due date', () => openTaskSheet(t.id, { focus: 'date' }), 'quiet'));
  if (mode === 'board' && !t.isCompleted) {
    hovs.append(sub
      ? iconBtn('unindent', 'Unindent (Shift+Tab)', () => unindentTask(t.id), 'quiet')
      : iconBtn('indent', 'Indent (Tab)', () => indentTask(t.id), 'quiet'));
  }

  row.append(...[grip, check, body, acts, hovs.children.length ? hovs : null].filter(Boolean));
  return row;
}

/** A parent with its open subtasks, kept together as one unit. */
function taskUnit(u, o) {
  const wrap = h('div', { class: 'unit', dataset: { unit: u.task.id } });
  wrap.append(taskRow(u.task, o));
  if (u.kids.length) {
    const subs = h('div', { class: 'subs' });
    u.kids.forEach((k) => subs.append(taskRow(k, o)));
    wrap.append(subs);
  }
  return wrap;
}

/** "Add a task": click for an inline input; Enter saves and opens the next one. */
function addRow(list) {
  const btn = () => h('button', {
    class: 'add-row', type: 'button',
    onclick: () => { UI.reopenAdd = null; open(); },
  }, icon('plus'), h('span', {}, 'Add a task'));
  const holder = h('div', { class: 'add-holder' });
  const closed = btn();
  holder.append(closed);

  function open() {
    const ta = h('textarea', { class: 'title grow', rows: 1, maxLength: 500, placeholder: 'Task title', a: { 'aria-label': `New task in ${list.name}` } });
    const wrap = h('div', { class: 'add-row open' }, h('span', { class: 'check ghost', a: { 'aria-hidden': 'true' } }), ta);
    let done = false;
    ta.addEventListener('input', () => autoSize(ta));
    ta.addEventListener('keydown', (e) => {
      if (e.isComposing) return;
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const v = ta.value.trim();
        if (!v) { done = true; holder.replaceChildren(btn()); return; }
        done = true;
        addTask(list.id, v);
        UI.reopenAdd = list.id;
        commit();
      } else if (e.key === 'Escape') { e.preventDefault(); done = true; UI.lastAdd[list.id] = null; holder.replaceChildren(btn()); }
    });
    ta.addEventListener('blur', () => {
      if (done) return;
      const v = ta.value.trim();
      if (v) { addTask(list.id, v); UI.lastAdd[list.id] = null; done = true; save(); deferRender(); }
      else { UI.lastAdd[list.id] = null; holder.replaceChildren(btn()); }
    });
    holder.replaceChildren(wrap);
    ta.focus();
  }

  if (UI.reopenAdd === list.id) { UI.reopenAdd = null; queueMicrotask(open); }
  return holder;
}

function completedDrawer(list, view) {
  const total = view.completed.reduce((n, c) => n + 1 + c.kids.length, 0);
  const open = !!list.completedOpen;
  const head = h('div', { class: 'drawer-head' },
    h('button', {
      class: 'drawer-toggle', type: 'button', a: { 'aria-expanded': String(open) },
      onclick: () => { list.completedOpen = !open; save(); render(); },
    }, icon('chevR', open ? 'turn' : ''), h('span', {}, `Completed (${total})`)),
    open && total ? h('button', { class: 'key small danger', type: 'button', onclick: () => purgeCompleted(list.id) }, icon('trash'), 'Delete all completed') : null);
  const wrap = h('div', { class: `drawer${open ? ' open' : ''}` }, head);
  if (open) {
    const body = h('div', { class: 'drawer-body', role: 'list' });
    if (!view.completed.length) body.append(h('p', { class: 'empty-note' }, 'Finished tasks will collect here.'));
    view.completed.forEach((c) => {
      const unit = h('div', { class: 'unit' }, taskRow(c.task, { mode: 'drawer', crumb: c.crumb }));
      if (c.kids.length) unit.append(h('div', { class: 'subs' }, c.kids.map((k) => taskRow(k, { mode: 'drawer' }))));
      body.append(unit);
    });
    wrap.append(body);
  }
  return wrap;
}

/* ===== Eommu calendar: Day and 7-day grids with an all-day row and hourly slots ===== */
'use strict';

const CAL_FIRST = 6, CAL_LAST = 22; // 06:00 to 22:00

function calChip(t, today) {
  const l = L.getList(S, t.listId);
  const late = !t.isCompleted && t.dueDate < today;
  const chip = h('div', {
    class: `chip c${(l ? l.color : 0) % 6}${t.isCompleted ? ' done' : ''}${late ? ' late' : ''}${t.parentId ? ' sub' : ''}`,
    dataset: { id: t.id, drag: 'chip' }, tabIndex: 0, role: 'button',
    title: `${t.title}${l ? ' – ' + l.name : ''}`,
    onclick: (e) => { if (!e.target.closest('.check')) openTaskSheet(t.id); },
    onkeydown: (e) => { if (e.key === 'Enter' && e.target === chip) { e.preventDefault(); openTaskSheet(t.id); } },
  },
  h('button', {
    class: 'check mini', type: 'button', role: 'checkbox',
    a: { 'aria-checked': String(t.isCompleted), 'aria-label': t.isCompleted ? 'Mark as not done' : 'Mark as done' },
    onclick: (e) => { e.stopPropagation(); toggleDone(t.id); },
  }, icon('check')),
  h('span', { class: 'ct' }, t.title || 'Untitled'),
  t.dueTime ? h('span', { class: 'cm' }, timeLabel(t.dueTime)) : null,
  t.isStarred ? icon('star', 'smallstar') : null);
  return chip;
}

function calRangeLabel(days, mode) {
  const a = L.parseDate(days[0]), b = L.parseDate(days[days.length - 1]);
  if (mode === 'day') return a.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  const sameMonth = a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear();
  const first = a.toLocaleDateString([], { month: 'short', day: 'numeric' });
  const last = sameMonth ? String(b.getDate()) : b.toLocaleDateString([], { month: 'short', day: 'numeric' });
  return `${first}–${last}, ${b.getFullYear()}`;
}

function calendarView() {
  const today = L.today();
  if (!UI.cal.date) UI.cal.date = today;
  const mode = S.settings.calMode === 'day' ? 'day' : 'week';
  const start = mode === 'week' ? L.startOfWeek(UI.cal.date) : UI.cal.date;
  const days = Array.from({ length: mode === 'week' ? 7 : 1 }, (_, i) => L.addDays(start, i));
  const step = mode === 'week' ? 7 : 1;
  const go = (d) => { UI.cal.date = d; render(); };

  const dated = S.tasks.filter((t) => t.dueDate && days.includes(t.dueDate));
  const cmp = (a, b) => (a.dueTime || '').localeCompare(b.dueTime || '') || a.order - b.order;

  const dayHead = days.map((d) => {
    const dt = L.parseDate(d);
    return h('button', {
      class: `day-h${d === today ? ' today' : ''}`, type: 'button', title: mode === 'week' ? 'Open this day' : '',
      onclick: () => { if (mode === 'week') { S.settings.calMode = 'day'; UI.cal.date = d; save(); render(); } },
    }, h('span', { class: 'dn' }, dt.toLocaleDateString([], { weekday: 'short' })), h('span', { class: 'dd' }, dt.getDate()));
  });

  const cols = `56px repeat(${days.length}, minmax(${mode === 'week' ? 124 : 200}px, 1fr))`;
  const minW = 56 + days.length * (mode === 'week' ? 124 : 200);

  const head = h('div', { class: 'cal-head', style: { gridTemplateColumns: cols } },
    h('div', { class: 'gut corner' }),
    dayHead,
    h('div', { class: 'gut ad-label' }, 'All day'),
    days.map((d) => h('div', { class: `allday${d === today ? ' today' : ''}`, dataset: { date: d } },
      dated.filter((t) => t.dueDate === d && !t.dueTime).sort(cmp).map((t) => calChip(t, today)))));

  const body = h('div', { class: 'cal-body', style: { gridTemplateColumns: cols } });
  const nowHM = L.nowHM();
  for (let hr = CAL_FIRST; hr <= CAL_LAST; hr++) {
    body.append(h('div', { class: 'gut hr', dataset: { hour: hr } }, h('span', {}, `${L.pad(hr)}:00`)));
    days.forEach((d) => {
      const inHour = dated.filter((t) => t.dueDate === d && t.dueTime && Math.min(CAL_LAST, Math.max(CAL_FIRST, parseInt(t.dueTime, 10))) === hr).sort(cmp);
      const slot = h('div', { class: `slot${d === today ? ' today' : ''}`, dataset: { date: d, hour: hr } }, inHour.map((t) => calChip(t, today)));
      if (d === today && parseInt(nowHM, 10) === hr) {
        slot.append(h('div', { class: 'nowline', style: { top: `${(parseInt(nowHM.slice(3), 10) / 60) * 100}%` }, title: `Now, ${timeLabel(nowHM)}` }));
      }
      body.append(slot);
    });
  }

  const scroll = h('div', { class: 'cal-scroll' }, h('div', { class: 'cal-inner', style: { minWidth: minW + 'px' } }, head, body));

  const bar = h('div', { class: 'cal-bar' },
    h('div', { class: 'cal-nav' },
      iconBtn('chevL', mode === 'week' ? 'Previous week' : 'Previous day', () => go(L.addDays(UI.cal.date, -step))),
      h('button', { class: 'key small', type: 'button', onclick: () => go(today) }, 'Today'),
      iconBtn('chevR', mode === 'week' ? 'Next week' : 'Next day', () => go(L.addDays(UI.cal.date, step)))),
    h('h3', { class: 'cal-label', a: { 'aria-live': 'polite' } }, calRangeLabel(days, mode)),
    segmented([['day', 'Day'], ['week', '7 days']], mode, (m) => { S.settings.calMode = m; save(); render(); }, 'Calendar range'));

  requestAnimationFrame(() => {
    if (UI.calInit) return;
    UI.calInit = true;
    const target = Math.min(CAL_LAST, Math.max(CAL_FIRST, new Date().getHours() - 1));
    const el = $(`.cal-body .gut.hr[data-hour="${target}"]`);
    const sc = $('.cal-scroll');
    if (el && sc) sc.scrollTop = Math.max(0, el.offsetTop - $('.cal-head').offsetHeight);
  });

  return h('div', { class: 'cal' }, bar, scroll);
}

/* ===== Eommu presets: reusable daily schedules, kept apart from live task lists ===== */
'use strict';

const MODES = [
  ['skip', 'Skip unfinished duplicates', 'An unfinished copy from an earlier day moves to the new date instead of being duplicated. Everything else is added.'],
  ['fresh', 'Fresh daily reset', 'Unfinished copies this preset made earlier are removed first, then a full new copy is added.'],
  ['append', 'Append all', 'A complete new copy is always added, whatever is already there.'],
];
const modeHelp = (m) => (MODES.find((x) => x[0] === m) || MODES[0])[2];

async function newPresetFlow() {
  const name = await promptDialog({ title: 'New preset', label: 'Preset name', confirmLabel: 'Create preset', placeholder: 'Morning routine' });
  if (!name) return;
  const p = L.newPreset(S, name);
  UI.presetId = p.id; UI.presetAddFocus = p.id;
  commit();
  setView('presets', { presetId: p.id, pane: 'edit' });
}

/* ----- item operations (items mirror tasks: parentId + order, two levels) ----- */
const presetTopIds = (p) => L.topLevel(p.items).map((i) => i.id);
function addItem(p, { parentId = null, afterId = null, title = '' } = {}) {
  const it = L.newPresetItem(p, { title, parentId });
  const sibs = (parentId ? L.childrenOf(p.items, parentId) : L.topLevel(p.items)).filter((x) => x !== it);
  let beforeId = null;
  if (afterId) { const i = sibs.findIndex((x) => x.id === afterId); beforeId = (sibs[i + 1] || {}).id || null; }
  L.place(p.items, it, { parentId, beforeId });
  return it;
}
function removeItem(p, id) {
  withUndo('Item removed from the preset.', () => {
    p.items = p.items.filter((i) => i.id !== id && i.parentId !== id);
  });
}

function presetItemRow(p, it) {
  const sub = !!it.parentId;
  const row = h('div', { class: `task prow${sub ? ' sub' : ''}${it.isStarred ? ' starred' : ''}`, tabIndex: -1, role: 'listitem', dataset: { id: it.id, level: sub ? 2 : 1, parent: it.parentId || '' } });
  const grip = h('span', { class: 'grip', dataset: { drag: 'pitem' }, title: 'Drag to reorder', a: { 'aria-hidden': 'true' } }, icon('grip'));
  const time = h('input', {
    class: 'time-in', type: 'time', value: it.time || '', title: 'Clock time, applied to whatever date you copy to',
    a: { 'aria-label': 'Clock time' },
  });
  time.addEventListener('change', () => { it.time = L.isTime(time.value) ? time.value : null; save(); });

  const ta = h('textarea', { class: 'title grow', rows: 1, maxLength: 500, value: it.title, placeholder: sub ? 'Subtask' : 'Task', spellcheck: true, a: { 'aria-label': 'Preset task title' } });
  ta.addEventListener('input', () => autoSize(ta));
  const flush = () => { const v = ta.value.trim(); if (v) { it.title = v.slice(0, 500); if (UI.fresh === it.id) UI.fresh = null; save(); return true; } return false; };
  ta.addEventListener('keydown', (e) => {
    if (e.isComposing) return;
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!flush()) { if (UI.fresh === it.id) { ta._done = true; p.items = p.items.filter((x) => x.id !== it.id); UI.fresh = null; commit(); } return; }
      ta._done = true;
      const n = addItem(p, { parentId: it.parentId, afterId: it.id });
      UI.fresh = n.id; UI.focusTitleId = n.id; commit();
    } else if (e.key === 'Escape') { e.preventDefault(); ta.value = it.title; ta._done = true; ta.blur(); }
    else if (e.key === 'Tab') {
      if (!e.shiftKey && !it.parentId && presetTopIds(p).indexOf(it.id) > 0) {
        e.preventDefault(); flush(); ta._done = true; UI.focusTitleId = it.id; indentItem(p, it);
      } else if (e.shiftKey && it.parentId) {
        e.preventDefault(); flush(); ta._done = true; UI.focusTitleId = it.id; unindentItem(p, it);
      }
    }
  });
  ta.addEventListener('blur', () => {
    if (ta._done) return;
    if (flush()) { deferRender(); return; }
    if (UI.fresh === it.id) { p.items = p.items.filter((x) => x.id !== it.id); UI.fresh = null; save(); deferRender(); } else ta.value = it.title;
  });
  if (UI.focusTitleId === it.id) UI.focusEl = ta;

  const star = h('button', {
    class: `star${it.isStarred ? ' on' : ''}`, type: 'button', title: it.isStarred ? 'Remove star' : 'Star as priority',
    a: { 'aria-pressed': String(it.isStarred), 'aria-label': it.isStarred ? 'Remove star' : 'Star as priority' },
    onclick: () => { it.isStarred = !it.isStarred; commit(); },
  }, icon('star'));
  const more = h('button', { class: 'ibtn quiet', type: 'button', title: 'More actions', a: { 'aria-label': 'More actions', 'aria-haspopup': 'menu' },
    onclick: () => {
      const items = [];
      if (!it.notes) items.push({ label: 'Add notes', icon: 'note', onClick: () => openNotes(it.id) });
      if (!sub) items.push({ label: 'Add subtask', icon: 'plus', onClick: () => { const n = addItem(p, { parentId: it.id }); UI.fresh = n.id; UI.focusTitleId = n.id; commit(); } });
      items.push({ label: 'Move up', icon: 'up', onClick: () => { if (L.nudge(p.items, it, -1)) { UI.focusId = it.id; commit(); } } },
        { label: 'Move down', icon: 'down', onClick: () => { if (L.nudge(p.items, it, 1)) { UI.focusId = it.id; commit(); } } },
        { sep: true }, { label: 'Delete item', icon: 'trash', danger: true, onClick: () => removeItem(p, it.id) });
      openMenu(more, items, { align: 'end' });
    } }, icon('more'));

  const acts = h('div', { class: 'acts' },
    sub ? iconBtn('unindent', 'Unindent (Shift+Tab)', () => unindentItem(p, it), 'quiet')
      : iconBtn('indent', 'Indent (Tab)', () => indentItem(p, it), 'quiet'),
    star, more);
  row.append(grip, time, h('div', { class: 'body' }, ta, notesBlock(it)), acts);
  row.addEventListener('focus', () => { UI.focusId = it.id; });
  return row;
}

function indentItem(p, it) {
  const r = L.indent(p.items, it, presetTopIds(p));
  if (!r.ok) { toast(r.reason === 'no-parent-above' ? 'There is no item above to nest this under.' : 'Subtasks only go one level deep.'); return; }
  UI.focusId = it.id; commit();
}
function unindentItem(p, it) {
  if (!L.unindent(p.items, it).ok) return;
  UI.focusId = it.id; commit();
}

function presetEditor(p) {
  const nameIn = h('input', { class: 'pe-name', type: 'text', value: p.name, maxLength: 120, a: { 'aria-label': 'Preset name' } });
  nameIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') nameIn.blur(); if (e.key === 'Escape') { nameIn.value = p.name; nameIn.blur(); } });
  nameIn.addEventListener('blur', () => { const v = nameIn.value.trim(); if (v && v !== p.name) { p.name = v.slice(0, 120); save(); deferRender(); } else nameIn.value = p.name; });

  const head = h('header', { class: 'pe-head' },
    UI.presetPane === 'edit' ? h('button', { class: 'ibtn back-btn', type: 'button', title: 'Back to presets', a: { 'aria-label': 'Back to presets' }, onclick: () => { UI.presetPane = 'list'; render(); } }, icon('chevL')) : null,
    nameIn,
    h('div', { class: 'pe-actions' },
      h('button', { class: 'key primary', type: 'button', onclick: () => copyPresetNow(p.id) }, icon('copy'), 'Copy preset to today'),
      h('button', { class: 'key', type: 'button', onclick: () => openCopyModal({ presetId: p.id }) }, icon('cal'), 'Customize / copy to date'),
      iconBtn('stack', 'Duplicate this preset', () => {
        const c = L.clonePreset(S, p, `${p.name} copy`);
        commit(); setView('presets', { presetId: c.id, pane: 'edit' }); toast(`Duplicated as “${c.name}”.`);
      }),
      iconBtn('trash', 'Delete this preset', async () => {
        const ok = await confirmDialog(`“${p.name}” will be deleted. Tasks already copied from it stay where they are.`, { confirmLabel: 'Delete preset', danger: true, title: 'Delete this preset?' });
        if (!ok) return;
        withUndo(`Preset “${p.name}” deleted.`, () => {
          S.presets = S.presets.filter((x) => x.id !== p.id);
          if (S.settings.lastPresetId === p.id) S.settings.lastPresetId = null;
          UI.presetId = null; UI.presetPane = 'list';
        });
      }, 'danger-i')));

  const listSel = h('select', { class: 'field', a: { 'aria-label': 'Target task list' }, onchange: () => { p.targetListId = listSel.value; save(); } },
    S.lists.slice().sort((a, b) => a.order - b.order).map((l) => h('option', { value: l.id, selected: l.id === p.targetListId }, l.name)));
  const modeSel = h('select', { class: 'field', a: { 'aria-label': 'When tasks already exist' } }, MODES.map(([v, label]) => h('option', { value: v, selected: v === p.conflictMode }, label)));
  const help = h('p', { class: 'help' }, modeHelp(p.conflictMode));
  modeSel.addEventListener('change', () => { p.conflictMode = modeSel.value; help.textContent = modeHelp(p.conflictMode); save(); });

  const autoTime = h('input', { class: 'field time', type: 'time', value: p.auto.time, a: { 'aria-label': 'Rollover time' } });
  const autoNote = h('p', { class: 'help' });
  const updNote = () => {
    autoNote.textContent = p.auto.enabled
      ? `Copies into ${presetTargetName(p)} at ${timeLabel(p.auto.time)} on the days chosen, the first time Eommu is open after that. Copying by hand today counts too.${p.lastCopiedDate ? ` Last copied ${dateLabel(p.lastCopiedDate)}.` : ''}`
      : 'Off. Turn it on to have this preset copied for you each day.';
  };
  autoTime.addEventListener('change', () => { if (L.isTime(autoTime.value)) { p.auto.time = autoTime.value; save(); updNote(); } else autoTime.value = p.auto.time; });
  const autoSw = switchBtn(p.auto.enabled, (on) => {
    p.auto.enabled = on;
    if (on && L.nowHM() >= p.auto.time && p.lastCopiedDate !== L.today()) {
      p.lastCopiedDate = L.today(); // don't copy straight away just because it was switched on late
      toast(`Auto-copy starts tomorrow at ${timeLabel(p.auto.time)}.`);
    }
    save(); updNote(); renderSidebar();
  }, 'Auto-copy every day');
  updNote();

  const settings = h('section', { class: 'pe-set' },
    h('label', { class: 'fld' }, h('span', {}, 'Copy into list'), listSel),
    h('div', { class: 'fld' }, h('label', { class: 'fl' }, 'If tasks from this preset already exist'), modeSel, help),
    h('div', { class: 'fld auto' },
      h('div', { class: 'auto-row' }, h('span', { class: 'fl' }, 'Auto-copy every day'), autoSw, h('label', { class: 'inl' }, h('span', {}, 'at'), autoTime)),
      dayPills(WEEK_SUN_FIRST, p.auto.days, (d) => { p.auto.days = d; save(); }, 'Days of the week'),
      autoNote));

  const items = h('section', { class: 'pe-items', a: { 'aria-label': 'Preset tasks' } });
  const ordered = L.topLevel(p.items);
  const list = h('div', { class: 'pe-rows', role: 'list', dataset: { preset: p.id } });
  ordered.forEach((it) => {
    const unit = h('div', { class: 'unit', dataset: { unit: it.id } }, presetItemRow(p, it));
    const kids = L.childrenOf(p.items, it.id);
    if (kids.length) unit.append(h('div', { class: 'subs' }, kids.map((k) => presetItemRow(p, k))));
    list.append(unit);
  });
  const add = h('textarea', { class: 'title grow add-in', rows: 1, maxLength: 500, placeholder: 'Add a task to this schedule', a: { 'aria-label': 'Add a task to this preset' } });
  add.addEventListener('input', () => autoSize(add));
  add.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
    e.preventDefault();
    const v = add.value.trim();
    if (!v) return;
    const it = addItem(p, { title: v });
    void it; UI.presetAddFocus = p.id; commit();
  });
  if (UI.presetAddFocus === p.id) { UI.presetAddFocus = null; UI.focusEl = add; }
  items.append(
    h('div', { class: 'pe-items-head' }, h('h3', {}, 'Schedule'), h('p', { class: 'help' }, 'Times repeat daily. They attach to whichever date you copy to.')),
    list,
    h('div', { class: 'pe-add' }, icon('plus'), add));
  if (!ordered.length) list.append(h('p', { class: 'empty-note' }, 'Nothing in this schedule yet. Add the tasks you do every day, in order.'));

  return h('div', { class: 'pe' }, head, settings, items);
}

/* ----- Customize / copy to date ----- */
function openCopyModal({ presetId, listId, date } = {}) {
  if (!S.presets.length) { toast('Create a preset first.'); setView('presets'); return; }
  let p = L.getPreset(S, presetId) || L.getPreset(S, S.settings.lastPresetId) || S.presets[0];
  const today = L.today();
  const st = { date: date || today, listId: listId || p.targetListId, mode: p.conflictMode, off: new Set(), choice: 'today' };
  if (st.date === L.addDays(today, 1)) st.choice = 'tomorrow'; else if (st.date !== today) st.choice = 'pick';

  const presetSel = h('select', { class: 'field', a: { 'aria-label': 'Preset' } }, S.presets.map((x) => h('option', { value: x.id, selected: x.id === p.id }, x.name)));
  const listSel = h('select', { class: 'field', a: { 'aria-label': 'Destination list' } },
    S.lists.slice().sort((a, b) => a.order - b.order).map((l) => h('option', { value: l.id, selected: l.id === st.listId }, l.name)));
  const modeSel = h('select', { class: 'field', a: { 'aria-label': 'Duplicate handling' } }, MODES.map(([v, label]) => h('option', { value: v, selected: v === st.mode }, label)));
  const dateIn = h('input', { class: 'field', type: 'date', min: today, value: st.date, a: { 'aria-label': 'Date' } });
  const checklist = h('div', { class: 'checklist', role: 'group', a: { 'aria-label': 'Tasks to copy' } });
  const countEl = h('span', {});
  const dateSeg = h('div', { class: 'seg', role: 'group', a: { 'aria-label': 'When' } });
  const copyBtnLabel = () => {
    const n = p.items.filter((i) => !st.off.has(i.id)).length;
    countEl.textContent = `Copy ${n} item${n === 1 ? '' : 's'}`;
  };

  function drawDateSeg() {
    dateSeg.replaceChildren(...[['today', 'Today'], ['tomorrow', 'Tomorrow'], ['pick', 'Pick a date']].map(([v, label]) => h('button', {
      type: 'button', class: st.choice === v ? 'on' : '', a: { 'aria-pressed': String(st.choice === v) },
      onclick: () => {
        st.choice = v;
        if (v === 'today') st.date = today; else if (v === 'tomorrow') st.date = L.addDays(today, 1);
        dateIn.value = st.date; dateIn.hidden = v !== 'pick'; drawDateSeg();
      },
    }, label)));
  }
  function drawChecklist() {
    checklist.replaceChildren();
    L.topLevel(p.items).forEach((it) => {
      const kids = L.childrenOf(p.items, it.id);
      const parentOff = st.off.has(it.id);
      const mk = (x, sub, disabled) => {
        const cb = h('input', { type: 'checkbox', checked: !st.off.has(x.id) && !disabled, disabled });
        cb.addEventListener('change', () => { if (cb.checked) st.off.delete(x.id); else st.off.add(x.id); drawChecklist(); copyBtnLabel(); });
        return h('label', { class: `ck${sub ? ' sub' : ''}${disabled ? ' off' : ''}` }, cb, h('span', { class: 'box' }, icon('check')),
          x.time ? h('span', { class: 'ck-time' }, timeLabel(x.time)) : h('span', { class: 'ck-time none' }, 'Any time'), h('span', { class: 'ck-t' }, x.title || 'Untitled'));
      };
      checklist.append(mk(it, false, false));
      kids.forEach((k) => checklist.append(mk(k, true, parentOff)));
    });
    if (!p.items.length) checklist.append(h('p', { class: 'empty-note' }, 'This preset is empty.'));
  }

  presetSel.addEventListener('change', () => {
    p = L.getPreset(S, presetSel.value); st.off = new Set();
    st.listId = p.targetListId; listSel.value = st.listId; st.mode = p.conflictMode; modeSel.value = st.mode;
    drawChecklist(); copyBtnLabel();
  });
  listSel.addEventListener('change', () => { st.listId = listSel.value; });
  modeSel.addEventListener('change', () => { st.mode = modeSel.value; modeNote.textContent = modeHelp(st.mode); });
  dateIn.addEventListener('change', () => { if (L.isDate(dateIn.value) && dateIn.value >= today) st.date = dateIn.value; else dateIn.value = st.date; });
  const modeNote = h('p', { class: 'help' }, modeHelp(st.mode));
  dateIn.hidden = st.choice !== 'pick';
  drawDateSeg(); drawChecklist(); copyBtnLabel();

  const body = h('div', { class: 'copy-form' },
    h('label', { class: 'fld' }, h('span', {}, 'Preset'), presetSel),
    h('div', { class: 'fld' }, h('span', { class: 'fl' }, 'Copy to'), dateSeg, dateIn),
    h('label', { class: 'fld' }, h('span', {}, 'Into list'), listSel),
    h('div', { class: 'fld' }, h('label', { class: 'fl' }, 'If tasks from this preset already exist'), modeSel, modeNote),
    h('div', { class: 'fld' },
      h('div', { class: 'fl-row' }, h('span', { class: 'fl' }, 'Tasks to include'),
        h('span', { class: 'mini-actions' },
          h('button', { class: 'linkbtn', type: 'button', onclick: () => { st.off = new Set(); drawChecklist(); copyBtnLabel(); } }, 'All'),
          h('button', { class: 'linkbtn', type: 'button', onclick: () => { st.off = new Set(p.items.map((i) => i.id)); drawChecklist(); copyBtnLabel(); } }, 'None'))),
      checklist,
      h('p', { class: 'help' }, 'Unchecked tasks are skipped for this copy only. The saved preset does not change.')));

  openDialog({
    title: 'Copy preset to a date', body, cls: 'wide-dlg',
    actions: [{ label: 'Cancel' }, {
      label: 'Copy', kind: 'primary', onClick: () => {
        const skip = new Set(st.off);
        p.items.forEach((i) => { if (i.parentId && st.off.has(i.parentId)) skip.add(i.id); });
        if (skip.size >= p.items.length) { toast('Pick at least one task to copy.'); return false; }
        copyPresetNow(p.id, { date: st.date, listId: st.listId, mode: st.mode, skip });
      },
    }],
  });
  // make the primary button show the live count
  const prim = $('dialog.wide-dlg .dlg-foot .key.primary');
  if (prim) { prim.replaceChildren(countEl); }
}

/* ===== Eommu sheets: task details, capture external source, settings and backup ===== */
'use strict';

function listSelect(selected) {
  return h('select', { class: 'field', a: { 'aria-label': 'List' } },
    S.lists.slice().sort((a, b) => a.order - b.order).map((l) => h('option', { value: l.id, selected: l.id === selected }, l.name)));
}
function normalizeUrl(u) {
  u = (u || '').trim();
  if (!u) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
  return safeUrl(u) || '';
}

/* ----- task details ----- */
function openTaskSheet(id, { focus } = {}) {
  const t = L.getTask(S, id);
  if (!t) return;
  const sub = !!t.parentId;
  const today = L.today();

  const title = h('input', { class: 'field', type: 'text', value: t.title, maxLength: 500, a: { 'aria-label': 'Title' } });
  const notes = h('textarea', { class: 'field', rows: 3, value: t.notes, placeholder: 'Notes. Links become clickable.', a: { 'aria-label': 'Notes' } });
  const date = h('input', { class: 'field', type: 'date', value: t.dueDate || '', a: { 'aria-label': 'Due date' } });
  const time = h('input', { class: 'field', type: 'time', value: t.dueTime || '', a: { 'aria-label': 'Clock time' } });
  const clear = h('button', { class: 'linkbtn', type: 'button', onclick: () => { date.value = ''; time.value = ''; syncRepeat(); } }, 'Clear date and time');
  time.addEventListener('change', () => { if (time.value && !date.value) date.value = today; });
  const listSel = listSelect(t.listId);
  const star = switchBtn(t.isStarred, () => {}, 'Priority star');
  const srcLabel = h('input', { class: 'field', type: 'text', value: t.source ? t.source.label : '', maxLength: 120, placeholder: 'Label, e.g. Email from Priya', a: { 'aria-label': 'Source label' } });
  const srcUrl = h('input', { class: 'field', type: 'text', value: t.source ? t.source.url : '', placeholder: 'https://', inputMode: 'url', a: { 'aria-label': 'Source link' } });

  /* repeat (top-level tasks only) */
  const r = t.recur || { freq: 'none', n: 1, weekdays: [], end: { type: 'never' } };
  const rs = { freq: r.freq || 'none', n: r.n || 1, weekdays: (r.weekdays || []).slice(), endType: (r.end && r.end.type) || 'never', endDate: (r.end && r.end.date) || '', endCount: (r.end && r.end.count) || 5 };
  const freq = h('select', { class: 'field', a: { 'aria-label': 'Repeat' } },
    [['none', 'Does not repeat'], ['day', 'Days'], ['week', 'Weeks'], ['month', 'Months'], ['year', 'Years']].map(([v, l]) => h('option', { value: v, selected: v === rs.freq }, l)));
  const every = h('input', { class: 'field num', type: 'number', min: 1, max: 365, value: rs.n, a: { 'aria-label': 'Repeat every' } });
  const wk = h('div', { class: 'rep-week' }, h('span', { class: 'fl' }, 'On'), dayPills(WEEK_MON_FIRST, rs.weekdays, (d) => { rs.weekdays = d; }, 'Repeat on weekdays'));
  const endSel = h('select', { class: 'field', a: { 'aria-label': 'Ends' } },
    [['never', 'Never ends'], ['date', 'Ends on a date'], ['count', 'Ends after a number of times']].map(([v, l]) => h('option', { value: v, selected: v === rs.endType }, l)));
  const endDate = h('input', { class: 'field', type: 'date', value: rs.endDate, a: { 'aria-label': 'End date' } });
  const endCount = h('input', { class: 'field num', type: 'number', min: 1, max: 999, value: rs.endCount, a: { 'aria-label': 'Number of occurrences' } });
  const repBox = h('div', { class: 'rep-box' });
  function syncRepeat() {
    const f = freq.value;
    every.parentElement && (every.parentElement.hidden = f === 'none');
    wk.hidden = f !== 'week';
    endSel.parentElement && (endSel.parentElement.hidden = f === 'none');
    endDate.hidden = f === 'none' || endSel.value !== 'date';
    endCount.hidden = f === 'none' || endSel.value !== 'count';
    unitEl.textContent = { day: 'day(s)', week: 'week(s)', month: 'month(s)', year: 'year(s)' }[f] || '';
  }
  const unitEl = h('span', {});
  freq.addEventListener('change', () => {
    if (freq.value !== 'none' && !date.value) date.value = today;
    if (freq.value === 'week' && !rs.weekdays.length && date.value) rs.weekdays = [L.weekday(date.value)];
    if (freq.value === 'week') { wk.replaceChildren(h('span', { class: 'fl' }, 'On'), dayPills(WEEK_MON_FIRST, rs.weekdays, (d) => { rs.weekdays = d; }, 'Repeat on weekdays')); }
    syncRepeat();
  });
  endSel.addEventListener('change', syncRepeat);
  repBox.append(
    h('label', { class: 'fld' }, h('span', {}, 'Repeat'), freq),
    h('div', { class: 'fld inl-row' }, h('span', { class: 'fl' }, 'Every'), every, unitEl),
    wk,
    h('div', { class: 'fld' }, h('span', { class: 'fl' }, 'End'), endSel, endDate, endCount));
  if (rs.freq === 'week' && wk) { /* pills already reflect saved weekdays */ }

  const body = h('div', { class: 'form' },
    h('label', { class: 'fld' }, h('span', {}, 'Title'), title),
    h('label', { class: 'fld' }, h('span', {}, 'Notes'), notes),
    h('div', { class: 'fld' }, h('span', { class: 'fl' }, 'Due'),
      h('div', { class: 'two' }, date, time), clear),
    sub ? h('p', { class: 'help' }, 'Subtasks follow their parent’s list and can’t repeat on their own.') : repBox,
    sub ? null : h('label', { class: 'fld' }, h('span', {}, 'List'), listSel),
    h('div', { class: 'fld row' }, h('span', { class: 'fl' }, 'Priority star'), star),
    h('div', { class: 'fld' }, h('span', { class: 'fl' }, 'Source link'),
      h('div', { class: 'two' }, srcLabel, srcUrl)));
  if (sub) repBox.hidden = true;
  syncRepeat();

  const dlg = openDialog({
    title: sub ? 'Subtask details' : 'Task details', body, cls: 'sheet',
    actions: [
      { label: 'Delete', kind: 'danger left', onClick: (close) => { close(); removeTask(id); return false; }, stay: true },
      { label: 'Cancel' },
      {
        label: 'Save changes', kind: 'primary',
        onClick: () => {
          const v = title.value.trim();
          if (!v) { toast('Give the task a title.'); title.focus(); return false; }
          if (srcUrl.value.trim() && !normalizeUrl(srcUrl.value)) { toast('That source link is not a web address.'); srcUrl.focus(); return false; }
          let dueDate = L.isDate(date.value) ? date.value : null;
          let dueTime = L.isTime(time.value) ? time.value : null;
          if (dueTime && !dueDate) dueDate = today;
          if (!dueDate) dueTime = null;
          let recur = null;
          if (!sub && freq.value !== 'none') {
            const n = Math.max(1, Math.min(365, parseInt(every.value, 10) || 1));
            const end = { type: endSel.value };
            if (end.type === 'date') {
              if (!L.isDate(endDate.value)) { toast('Pick an end date for the repeat.'); endDate.focus(); return false; }
              end.date = endDate.value;
            }
            if (end.type === 'count') end.count = Math.max(1, parseInt(endCount.value, 10) || 1);
            recur = {
              freq: freq.value, n, end, occ: (t.recur && t.recur.occ) || 1,
              weekdays: freq.value === 'week' ? (rs.weekdays.length ? rs.weekdays.slice() : [L.weekday(dueDate || today)]) : [],
              anchorDay: (freq.value === 'month' || freq.value === 'year') && dueDate ? L.parseDate(dueDate).getDate() : undefined,
            };
            if (!dueDate) dueDate = today;
          }
          const src = srcUrl.value.trim() ? { label: srcLabel.value.trim(), url: normalizeUrl(srcUrl.value) } : null;
          t.title = v; t.notes = notes.value.slice(0, 4000); t.dueDate = dueDate; t.dueTime = dueTime; t.source = src;
          if (!sub) t.recur = recur;
          const wantStar = star.getAttribute('aria-checked') === 'true';
          if (wantStar !== t.isStarred) L.setStarred(S, id, wantStar);
          if (!sub && listSel.value !== t.listId) moveToList(id, listSel.value);
          commit();
          if (dueTime) nudgeNotifications();
        },
      },
    ],
  });
  const fe = { date, time, repeat: freq, title }[focus] || title;
  setTimeout(() => { fe.focus(); if (fe === title) title.select(); }, 30);
  void dlg;
}

/* ----- backup ----- */
function exportBackup() {
  const payload = { app: 'eommu', version: 1, exportedAt: new Date().toISOString(), data: S };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: `eommu-backup-${L.today()}.json` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Backup downloaded.');
}
function importBackup(file) {
  const rd = new FileReader();
  rd.onerror = () => toast('That file could not be read.');
  rd.onload = async () => {
    let next;
    try { next = L.validateImport(JSON.parse(String(rd.result))); }
    catch (e) { toast(e instanceof SyntaxError ? 'That file is not valid JSON.' : e.message, { ms: 7000 }); return; }
    const ok = await confirmDialog(
      `This replaces everything in Eommu with the backup: ${next.lists.length} lists, ${next.tasks.length} tasks and ${next.presets.length} presets. Export first if you want to keep what is here now.`,
      { confirmLabel: 'Replace everything', danger: true, title: 'Restore this backup?' });
    if (!ok) return;
    S = next; commit(); toast('Backup restored.');
  };
  rd.readAsText(file);
}

/* ----- settings ----- */
function openSettings() {
  const themeSeg = () => segmented([['light', 'Light', 'sun'], ['system', 'System', 'sliders'], ['dark', 'Dark', 'moon']], S.settings.theme,
    (v) => { S.settings.theme = v; save(); applyTheme(); renderSidebar(); seg.replaceWith(seg = themeSeg()); }, 'Theme');

  const notifState = h('p', { class: 'help' });
  const notifBtn = h('button', { class: 'key', type: 'button' });
  const testBtn = h('button', { class: 'key', type: 'button', onclick: () => sendTestNotification() }, icon('bell'), 'Send a test');
  const drawNotif = () => {
    const supported = 'Notification' in window;
    const perm = supported ? Notification.permission : 'unsupported';
    notifState.textContent = !supported ? 'This browser does not support notifications. Reminders still show inside Eommu while it is open.'
      : perm === 'granted' ? 'Notifications are allowed. Reminders fire at the clock time you set on a task.'
      : perm === 'denied' ? 'Notifications are blocked for this site. Allow them in your browser or system settings to get alerts outside Eommu.'
      : 'Allow notifications to get a reminder at the clock time of a task, even when Eommu is in the background.';
    notifBtn.hidden = perm !== 'default'; testBtn.hidden = perm !== 'granted';
